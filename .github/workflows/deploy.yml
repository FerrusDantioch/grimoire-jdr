name: Deploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits requis par actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; les pushs successifs remplacent le precedent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Sert le site depuis https://<compte>.github.io/<depot>/
          GITHUB_PAGES: ${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
